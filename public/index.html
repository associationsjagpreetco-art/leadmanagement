<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Lead CRM</title>
<style>
:root{--b:#e4e7ec;--t:#101828;--m:#667085;--a:#3b5bdb}*{box-sizing:border-box}
body{margin:0;font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--t);background:#f8f9fb;display:flex;min-height:100vh}
nav{width:190px;background:#fff;border-right:1px solid var(--b);padding:14px 8px;position:sticky;top:0;height:100vh;flex:none}nav b{display:block;padding:2px 10px 14px;font-size:14px}
nav a{display:block;padding:7px 10px;border-radius:5px;color:#344054;text-decoration:none}nav a.on{background:#eef2ff;color:var(--a);font-weight:600}
main{flex:1;padding:20px 24px;min-width:0;max-width:1400px}h1{font-size:18px;margin:0 0 12px}h2{font-size:11px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--m)}
a{color:var(--a);text-decoration:none}.card{background:#fff;border:1px solid var(--b);border-radius:6px;padding:12px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.grid .card{margin:0}.k{font-size:11px;color:var(--m)}.v{font-size:20px;font-weight:600}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--b)}th,td{padding:7px 10px;border-bottom:1px solid var(--b);text-align:left}th{font-size:11px;color:var(--m);background:#fafbfc;text-transform:uppercase}tr.r{cursor:pointer}tr.r:hover{background:#f5f7ff}.sc{overflow-x:auto}
input,select,textarea,button{font:inherit;border:1px solid #d0d5dd;border-radius:5px;padding:5px 8px;background:#fff;color:inherit}textarea{width:100%;resize:vertical;margin:6px 0}button{cursor:pointer}button:hover{background:#f2f4f7}button.pri{background:var(--a);color:#fff;border-color:var(--a)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.m{color:var(--m)}.red{color:#d92d20;font-weight:600}.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bd{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:#f2f4f7;color:#344054}.bd.bad{background:#fee4e2;color:#b42318}.s-Won{background:#d1fadf;color:#05603a}.s-Lost{background:#fee4e2;color:#b42318}.s-Replied,.s-Qualified{background:#e0eaff;color:#2d4ac0}.s-CallBooked,.s-ProposalSent{background:#fef0c7;color:#93370d}
.two{display:grid;grid-template-columns:330px 1fr;gap:12px;align-items:start}label{display:block;font-size:11px;color:var(--m);margin-bottom:8px}label input,label select,label textarea{width:100%;display:block;color:var(--t);margin-top:2px}
.tl{border-left:2px solid var(--b);margin-left:6px;padding-left:14px}.tl>div{margin-bottom:12px;position:relative}.tl>div:before{content:attr(data-i);position:absolute;left:-23px;top:0;background:#f8f9fb;font-size:13px}
pre{white-space:pre-wrap;font:inherit;background:#f9fafb;border:1px solid var(--b);border-radius:5px;padding:6px 8px;margin:6px 0}
.kan{display:flex;gap:8px;overflow-x:auto;align-items:flex-start}.col{min-width:190px;flex:1;background:#f2f4f7;border-radius:6px;padding:8px;min-height:200px}.col .card{padding:8px;cursor:grab}
#toast{position:fixed;bottom:16px;right:16px;background:#101828;color:#fff;padding:8px 14px;border-radius:6px;display:none}
@media(max-width:820px){body{flex-direction:column}nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto}nav b{display:none}main{padding:12px}.two{grid-template-columns:1fr}}
</style></head><body>
<nav id=nav><b>◆ Lead CRM</b></nav><main id=M></main><div id=toast></div>
<script>
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),$=s=>document.querySelector(s);
const api=async(u,m='GET',b)=>{const r=await fetch('/api'+u,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});if(r.status===401){const p=prompt('Password');if(p){await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});location.reload()}throw 0}if(!r.ok){toast(await r.text());throw 0}return r.json()};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};
const ST=['New','Contacted','Follow-up','Replied','Qualified','Call Booked','Proposal Sent','Won','Lost'],TP={Hot:'🔥 Hot',Warm:'🟡 Warm',Cold:'🔵 Cold'};
const NAV=[['dash','Dashboard'],['leads','Leads'],['outreach',"Today's Outreach"],['followups','Follow-ups'],['pipeline','Pipeline'],['templates','Templates'],['io','Import / Export'],['analytics','Analytics'],['settings','Settings']];
const bd=s=>`<span class="bd s-${String(s).replace(/\W/g,'')}">${E(s)}</span>`,d10=d=>d?String(d).slice(0,10):'—',opt=(a,v,all)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option ${x==v?'selected':''}>${E(x)}</option>`).join('');
let meta,F={};const qs=o=>new URLSearchParams(Object.entries(o).filter(e=>e[1])).toString();
const tcard=t=>{const od=t.due<meta.today;return `<div class=card data-t=${t.id}><div class=row><a href="#/lead/${t.lead_id}"><b>${E(t.name)}</b></a><span class=m>${E(t.business)} ${t.niche?'· '+E(t.niche):''}</span>${TP[t.temp]||''}<span class=sp></span><span class="bd ${od?'bad':''}">${E(t.label)} · Day ${t.day}</span><span class="${od?'red':'m'}">${od?'Overdue · ':'Due '}${t.due}</span></div>
<textarea rows=3>${E(t.msg)}</textarea><div class=row><button class=pri data-a=copy>Copy Message</button><button data-a=sent>Mark as Sent</button><button data-a=snooze>Snooze / Reschedule</button><button data-a=skip>Skip</button><button data-a=reply>Mark as Replied</button><span class=m>${E(t.lead_channel||'')} ${E(t.email||t.phone||t.instagram||'')}</span></div></div>`};
const ncard=(l,msg)=>`<div class=card data-l=${l.id}><div class=row><a href="#/lead/${l.id}"><b>${E(l.name||l.business)}</b></a><span class=m>${E(l.business)} ${l.niche?'· '+E(l.niche):''}</span>${TP[l.temp]||''}<span class=sp></span><span class=bd>Day 0 · Initial Message</span></div>
<div class=m>${E(l.problem||'')}</div><textarea rows=3>${E(msg)}</textarea><div class=row><button class=pri data-a=copy>Copy Message</button><select>${opt(meta.channels,l.channel)}</select><button data-a=contact>Mark Initial Sent</button><span class=m>${E(l.email||l.phone||l.instagram||l.website||'')}</span></div></div>`;
const lrow=l=>`<tr class=r onclick="location.hash='#/lead/${l.id}'"><td><b>${E(l.name||l.business)}</b> <span class=m>${E(l.business)}</span></td><td>${E(l.niche)}</td><td>${TP[l.temp]||''}</td><td>${bd(l.status)}</td><td>${E(l.channel)}</td><td>${d10(l.first_contact)}</td><td>${l.next_due?`<span class="${l.next_due<meta.today?'red':''}">${l.next_due}</span> <span class=m>${E(l.next_label)}</span>`:'—'}</td><td>${l.amount||''}</td></tr>`;
const ltab=a=>a.length?`<div class=sc><table><tr><th>Lead<th>Niche<th>Temp<th>Status<th>Channel<th>Contacted<th>Next follow-up<th>Deal</tr>${a.map(lrow).join('')}</table></div>`:'<div class="card m">Nothing here.</div>';
const sec=(t,n,h)=>`<h2>${t} (${n})</h2>${h||'<div class="card m">All clear.</div>'}`;
function actions(t,lim){const L=a=>a.slice(0,lim);return sec('Follow-ups due · '+t.overdue+' overdue',t.due.length,L(t.due).map(tcard).join('')+(t.due.length>lim?'<a href="#/followups">View all →</a>':''))
+sec('New leads to contact · '+t.contacted+'/'+t.target+' done today',t.newLeads.length,L(t.newLeads).map(l=>ncard(l,l.msg)).join('')+(t.newLeads.length>lim?'<a href="#/outreach">Work all →</a>':''))
+sec('Replies to handle',t.replies.length,ltab(L(t.replies)))+sec('Hot leads',t.hot.length,ltab(L(t.hot)))+sec('Closest to becoming clients',t.closing.length,ltab(L(t.closing)))}
const tomorrow=()=>{const d=new Date(meta.today+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const box=b.closest('[data-t],[data-l]'),m=box.querySelector('textarea,pre'),a=b.dataset.a,tid=box.dataset.t,lid=box.dataset.l,txt=m?.value??m?.textContent;
 if(a==='copy'){await navigator.clipboard.writeText(txt);return toast('Copied')}
 if(a==='contact')await api(`/leads/${lid}/contact`,'POST',{body:txt,channel:box.querySelector('select').value});
 if(a==='sent')await api(`/tasks/${tid}/sent`,'POST',{body:txt});if(a==='skip')await api(`/tasks/${tid}/skip`,'POST');
 if(a==='snooze'){let v=prompt('Reschedule to date (YYYY-MM-DD) or +days',tomorrow());if(!v)return;if(/^\+\d+$/.test(v)){const d=new Date(meta.today+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+ +v);v=d.toISOString().slice(0,10)}await api(`/tasks/${tid}/snooze`,'POST',{due:v})}
 if(a==='reply'){const t=prompt('Their reply (optional)','');if(t===null)return;await api(`/tasks/${tid}/reply`,'POST',{text:t})}
 route()});
async function dash(){const[d,t]=await Promise.all([api('/dashboard'),api('/today')]),K=[['Total Leads',d.total],['Contacted Today',d.contactedToday],['New Leads',d.fresh],['🔥 Hot',d.hot],['🟡 Warm',d.warm],['🔵 Cold',d.cold],['Follow-ups Due Today',d.dueToday],['Overdue Follow-ups',d.overdue],['Calls Booked',d.calls],['Proposals Sent',d.proposals],['Won Clients',d.won],['Lost Leads',d.lost],['Total Revenue',d.revenue.toLocaleString()],['Conversion Rate',d.conversion+'%']];
 M.innerHTML=`<h1>Good day — ${meta.today}</h1><h2 style="margin-top:0">Today's Actions</h2>${actions(t,4)}<h2>Metrics</h2><div class=grid>${K.map(k=>`<div class=card><div class=k>${k[0]}</div><div class=v>${k[1]}</div></div>`).join('')}</div>`}
async function outreach(){const t=await api('/today'),K=[['Contacted today',t.contacted+' / '+t.target],['Remaining new',t.newTotal],['Follow-ups due',t.due.length],['Overdue',t.overdue],['Replies today',t.repliesToday],['Hot leads',t.hot.length]];
 M.innerHTML=`<h1>Today's Outreach</h1><div class=grid>${K.map(k=>`<div class=card><div class=k>${k[0]}</div><div class=v>${k[1]}</div></div>`).join('')}</div>`+actions(t,1e9)}
async function followups(){const a=await api('/followups?by='+(()=>{const d=new Date(meta.today+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+14);return d.toISOString().slice(0,10)})()),n=a.filter(x=>x.due<=meta.today),u=a.filter(x=>x.due>meta.today);
 M.innerHTML=`<h1>Follow-ups</h1>${sec('Due & overdue',n.length,n.map(tcard).join(''))}${sec('Upcoming · next 14 days',u.length,u.length?`<div class=sc><table><tr><th>Lead<th>Step<th>Due<th>Message</tr>${u.map(t=>`<tr class=r onclick="location.hash='#/lead/${t.lead_id}'"><td>${E(t.name)} <span class=m>${E(t.business)}</span><td>${E(t.label)}<td>${t.due}<td class=m>${E(t.msg.slice(0,90))}</tr>`).join('')}</table></div>`:'')}`}
async function leads(){const a=await api('/leads?'+qs(F));
 M.innerHTML=`<h1>Leads <span class=m>(${a.length})</span></h1><div class=bar><input id=fq placeholder="Search name, business, email, phone, website" value="${E(F.q||'')}" size=34><select data-f=status>${opt(ST,F.status,'All statuses')}</select><select data-f=temp>${opt(['Hot','Warm','Cold'],F.temp,'All temps')}</select><select data-f=niche>${opt(meta.niches,F.niche,'All niches')}</select><select data-f=channel>${opt(meta.channels,F.channel,'All channels')}</select>
 <label style="margin:0">Contacted <input type=date data-f=from value="${F.from||''}"> – <input type=date data-f=to value="${F.to||''}"></label><label style="margin:0">Follow-up by <input type=date data-f=dueby value="${F.dueby||''}"></label><select data-f=due>${opt(['today','overdue'],F.due,'Any follow-up')}</select><span class=sp></span><button id=cl>Clear</button><a href="/api/export?format=xlsx&${qs(F)}">Export XLSX</a><a href="/api/export?format=csv&${qs(F)}">CSV</a><button class=pri id=nl>+ Add lead</button></div>${ltab(a)}`;
 let tm;$('#fq').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{F.q=e.target.value;route(1)},300)};document.querySelectorAll('[data-f]').forEach(x=>x.onchange=()=>{F[x.dataset.f]=x.value;route()});$('#cl').onclick=()=>{F={};route()};
 $('#nl').onclick=async()=>{const name=prompt('Lead name');if(name===null)return;const business=prompt('Business')||'';const r=await api('/leads','POST',{name,business});location.hash='#/lead/'+r.id}}
async function lead(id){const{l,msg0,tasks,acts}=await api('/leads/'+id),nx=tasks.find(t=>t.status==='pending')?.id,I=(f,lab,ty='text')=>`<label>${lab}<input data-p=${f} type=${ty} value="${E(l[f])}"></label>`,T=(f,lab)=>`<label>${lab}<textarea rows=3 data-p=${f}>${E(l[f])}</textarea></label>`;
 const icon={sent:'✓',pending:'○',skipped:'✕',cancelled:'–'},tl=tasks.map(t=>{const cur=t.id===nx;return `<div data-i="${cur?'●':icon[t.status]}" ${t.status==='pending'?`data-t=${t.id}`:''}><b>Day ${t.day}</b> · ${E(t.label)} ${t.status==='sent'?`<span class=m>— sent ${E(t.sent_at?.replace('T',' ').slice(0,16))} · ${E(t.channel||'')}</span>`:t.status==='pending'?`<span class="${t.due<meta.today?'red':'m'}">— due ${t.due}</span>`:`<span class=m>— ${t.status}</span>`}
 ${t.status==='pending'&&cur?`<textarea rows=3>${E(t.msg)}</textarea><div class=row><button class=pri data-a=copy>Copy</button><button data-a=sent>Mark Sent</button><button data-a=snooze>Reschedule</button><button data-a=skip>Skip</button><button data-a=reply>Replied</button></div>`:`<pre>${E(t.msg)}</pre>`+(t.status==='pending'?'<div class=row><button data-a=copy>Copy</button><button data-a=snooze>Reschedule</button></div>':'')}</div>`}).join('');
 M.innerHTML=`<div class=row><a href="#/leads">← Leads</a><h1 style="margin:0">${E(l.name||l.business)}</h1>${bd(l.status)}${TP[l.temp]}<span class=sp></span><button id=del>Delete</button></div><div class=two style="margin-top:12px"><div class=card>
 <label>Status<select data-p=status>${opt(ST,l.status)}</select></label><label>Temperature<select data-p=temp>${opt(['Hot','Warm','Cold'],l.temp)}</select></label>${I('name','Name')}${I('business','Business')}${I('niche','Niche')}${I('website','Website')}${l.website?`<a target=_blank href="${/^http/.test(l.website)?'':'https://'}${E(l.website)}">Open site ↗</a>`:''}${I('email','Email')}${I('phone','Phone')}${I('instagram','Instagram')}${I('contact','Contact')}<label>Channel<select data-p=channel>${opt(meta.channels,l.channel,'—')}</select></label>${T('problem','Problem identified')}${T('personalization','Personalization note')}${T('response','Latest response')}${I('amount','Deal value','number')}${I('revenue','Revenue','number')}<label><input type=checkbox style="display:inline;width:auto" data-p=call_booked ${l.call_booked?'checked':''}> Call booked</label><label><input type=checkbox style="display:inline;width:auto" data-p=proposal_sent ${l.proposal_sent?'checked':''}> Proposal sent</label>${T('notes','Internal notes')}</div>
 <div><h2 style="margin-top:0">Follow-up timeline</h2><div class=card>${tasks.length?`<div class=tl>${tl}</div>`:ncard(l,msg0)}</div>
 <h2>Log activity</h2><div class="card row"><select id=lt><option value=note>Note</option><option value=reply>Reply received</option><option value=call>Call booked</option><option value=proposal>Proposal sent</option></select><input id=lx size=46 placeholder="Details"><button id=lb class=pri>Add</button></div>
 <h2>History</h2><div class=sc><table>${acts.map(a=>`<tr><td class=m style="white-space:nowrap">${a.at.replace('T',' ').slice(0,16)}<td>${bd(a.type)}<td style="white-space:pre-wrap">${E(a.text)}</tr>`).join('')}</table></div></div></div>`;
 document.querySelectorAll('[data-p]').forEach(x=>x.onchange=async()=>{await api('/leads/'+id,'PUT',{[x.dataset.p]:x.type==='checkbox'?+x.checked:x.value});route(1)});
 $('#lb').onclick=async()=>{await api(`/leads/${id}/log`,'POST',{type:$('#lt').value,text:$('#lx').value});route(1)};$('#del').onclick=async()=>{if(confirm('Delete this lead and its history?')){await api('/leads/'+id,'DELETE');location.hash='#/leads'}}}
async function pipeline(){const a=await api('/leads');M.innerHTML=`<h1>Pipeline</h1><div class=kan>${ST.map(s=>{const x=a.filter(l=>l.status===s);return `<div class=col data-s="${s}"><b>${s}</b> <span class=m>${x.length}</span>${x.slice(0,60).map(l=>`<div class=card draggable=true data-id=${l.id}><a href="#/lead/${l.id}">${E(l.name||l.business)}</a><div class=m>${E(l.business)} ${TP[l.temp]?.slice(0,2)||''} ${l.amount?'· '+l.amount:''}</div></div>`).join('')}</div>`}).join('')}</div>`;
 document.querySelectorAll('.card[draggable]').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('t',c.dataset.id));document.querySelectorAll('.col').forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=async e=>{await api('/leads/'+e.dataTransfer.getData('t'),'PUT',{status:c.dataset.s});route(1)}})}
let SQ=0;async function templates(){const S=await api('/seqs'),s=S.find(x=>x.id==SQ)||S[0];SQ=s.id;
 M.innerHTML=`<h1>Templates & Sequences</h1><div class=bar><select id=ss>${S.map(x=>`<option value=${x.id} ${x.id==SQ?'selected':''}>${E(x.name)}</option>`).join('')}</select><button id=ns>+ New sequence</button><span class=m>Variables: {{name}} {{business}} {{niche}} {{website}} {{problem}} {{personalization}} {{email}} {{phone}}. Day = days after the initial message. Edits apply to all pending follow-ups.</span></div>
 ${s.steps.map(t=>`<div class=card data-st=${t.id}><div class=row>Day <input type=number size=3 style="width:60px" value=${t.day}><input value="${E(t.label)}" style="width:200px"><span class=sp></span><button data-x=save class=pri>Save</button><button data-x=del>Delete</button></div><textarea rows=3>${E(t.body)}</textarea></div>`).join('')}<button id=as>+ Add step</button>`;
 $('#ss').onchange=e=>{SQ=e.target.value;route()};$('#ns').onclick=async()=>{const n=prompt('Sequence name');if(n){const r=await api('/seqs','POST',{name:n});SQ=r.id;route()}};$('#as').onclick=async()=>{await api(`/seqs/${SQ}/steps`,'POST',{day:+(prompt('Day offset',14)||0)});route(1)};
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const c=b.closest('[data-st]'),i=c.querySelectorAll('input');if(b.dataset.x==='del'){if(!confirm('Delete step? Pending tasks for it are cancelled.'))return;await api('/steps/'+c.dataset.st,'DELETE')}else{await api('/steps/'+c.dataset.st,'PUT',{day:+i[0].value,label:i[1].value,body:c.querySelector('textarea').value});toast('Saved')}route(1)})}
let IM;async function io(){M.innerHTML=`<h1>Import / Export</h1><div class=card><b>Import Excel / CSV</b><div class=row style="margin:8px 0"><input type=file id=fi accept=".csv,.xlsx,.xls"><span class=m>Columns are auto-detected; fix any mapping before importing. Duplicates are matched on email, phone and website.</span></div><div id=mp></div></div><div class=card><b>Export</b> <span class=m>(uses current Leads filters)</span><div class=row style="margin-top:8px"><a href="/api/export?format=xlsx&${qs(F)}">Download XLSX</a><a href="/api/export?format=csv&${qs(F)}">Download CSV</a></div></div>`;
 $('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;IM=await (await fetch('/api/import/parse',{method:'POST',body:await f.arrayBuffer()})).json();if(IM.error)return;
  $('#mp').innerHTML=`<table><tr><th>CRM field<th>File column<th>Sample</tr>${IM.fields.map(k=>`<tr><td>${k}<td><select data-k=${k}><option value="">— ignore —</option>${IM.headers.map(h=>`<option ${IM.map[k]===h?'selected':''}>${E(h)}</option>`).join('')}</select><td class=m>${E(IM.map[k]?IM.rows[0][IM.map[k]]:'')}</tr>`).join('')}</table><div class=row style="margin-top:8px"><span id=pv></span><span class=sp></span><label style="margin:0"><input type=checkbox id=sk checked style="display:inline;width:auto"> Skip duplicates</label><button class=pri id=go>Import</button></div>`;
  const pv=async()=>{const p=await api('/import/preview','POST',IM);$('#pv').innerHTML=`<b>${p.fresh}</b> to import · <b>${p.dupDb}</b> duplicate (already in CRM) · <b>${p.dupFile}</b> duplicate (within file) · <b>${p.empty}</b> empty · ${p.total} rows`};pv();
  document.querySelectorAll('[data-k]').forEach(s=>s.onchange=()=>{IM.map[s.dataset.k]=s.value;pv()});$('#go').onclick=async()=>{let im=0,sk=0;for(let i=0;i<IM.rows.length;i+=40){toast(`Importing ${i}/${IM.rows.length}…`);const r=await api('/import/commit','POST',{rows:IM.rows.slice(i,i+40),map:IM.map,skipDup:$('#sk').checked});im+=r.imported;sk+=r.skipped}toast(`Imported ${im}, skipped ${sk}`);location.hash='#/leads'}}}
let AF={};async function analytics(){const a=await api('/analytics?'+qs(AF)),K=[['Leads contacted',a.contacted],['Reply rate',a.replyRate+'%'],['Positive reply rate',a.positiveRate+'%'],['Calls booked',a.calls],['Proposals',a.proposals],['Proposal conversion',a.proposalConv+'%'],['Win rate',a.winRate+'%'],['Revenue',a.revenue.toLocaleString()],['Revenue / 100 leads',a.per100.toLocaleString()],['Follow-up conversion',a.fuConv+'%']],mx=Math.max(1,...a.perDay.map(x=>x.n)),tb=(t,r)=>`<h2>${t}</h2><div class=sc><table><tr><th>${t.split(' ')[0]}<th>Leads<th>Replied<th>Reply rate<th>Won<th>Revenue</tr>${r.map((x,i)=>`<tr><td>${i?'':'🏆 '}${E(x.k)}<td>${x.n}<td>${x.replied}<td>${x.n?Math.round(x.replied/x.n*100):0}%<td>${x.won}<td>${x.revenue}</tr>`).join('')}</table></div>`;
 const pr=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')};
 M.innerHTML=`<h1>Analytics</h1><div class=bar><label style="margin:0">From <input type=date id=af value="${AF.from||''}"></label><label style="margin:0">To <input type=date id=at value="${AF.to||''}"></label><button data-r=7>7d</button><button data-r=30>30d</button><button data-r=0>All</button></div><div class=grid>${K.map(k=>`<div class=card><div class=k>${k[0]}</div><div class=v>${k[1]}</div></div>`).join('')}</div>
 <h2>Leads contacted per day</h2><div class=card style="display:flex;gap:3px;align-items:flex-end;height:120px;overflow-x:auto">${a.perDay.map(x=>`<div title="${x.d}: ${x.n}" style="min-width:14px;flex:1;background:#3b5bdb;height:${x.n/mx*100}%"></div>`).join('')||'<span class=m>No data</span>'}</div>${tb('Niche performance (best first)',a.niches)}${tb('Channel performance (best first)',a.channels)}`;
 $('#af').onchange=e=>{AF.from=e.target.value;route(1)};$('#at').onchange=e=>{AF.to=e.target.value;route(1)};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{AF=+b.dataset.r?{from:pr(+b.dataset.r)}:{};route(1)})}
async function settings(){const s=meta.settings;M.innerHTML=`<h1>Settings</h1><div class=card style="max-width:480px"><label>Default follow-up sequence<select id=s1>${meta.seqs.map(x=>`<option value=${x.id} ${x.id==s.default_seq?'selected':''}>${E(x.name)}</option>`).join('')}</select></label><label>Daily outreach target<input id=s2 type=number value=${s.daily_target}></label><label>Channels (comma separated)<input id=s3 value="${E(s.channels)}"></label><button class=pri id=sv>Save</button></div>`;
 $('#sv').onclick=async()=>{await api('/settings','PUT',{default_seq:$('#s1').value,daily_target:$('#s2').value,channels:$('#s3').value});toast('Saved');route(1)}}
const R={dash,leads,outreach,followups,pipeline,templates,io,analytics,settings,lead};
async function route(keep){const y=scrollY,h=(location.hash.slice(2)||'dash').split('/'),p=R[h[0]]?h[0]:'dash';meta=await api('/meta');
 $('#nav').innerHTML='<b>◆ Lead CRM</b>'+NAV.map(n=>`<a href="#/${n[0]}" class="${n[0]===p||(p==='lead'&&n[0]==='leads')?'on':''}">${n[1]}</a>`).join('');await R[p](h[1]);scrollTo(0,keep===undefined?y:y)}
addEventListener('hashchange',()=>{scrollTo(0,0);route(0)});route();
</script></body></html>
